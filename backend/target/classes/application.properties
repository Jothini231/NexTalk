server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/chatdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=chatApplicationSecretKeyPhase1VeryLongSecretKeyForHMACAlgorithm2024Production
app.jwt.expiration=86400000

# Logging
logging.level.com.chat=DEBUG
logging.level.org.springframework.security=DEBUG
